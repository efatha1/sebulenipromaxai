[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".pytest_cache",
  ".trae",
  ".trae-html-share-packages",
  "**/__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "inference", "models", "training"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
packages = ["api", "inference", "models", "training"]
