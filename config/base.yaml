instrument:
  instrument_id: "XAUUSD"

data_source:
  ohlc_path: "/kaggle/input/datasets/efathakanafunzi/full1minohlc-parquet/1min_OHLCnw1Fixed.parquet"

time:
  source_timezone: "UTC"
  runtime_timezone: "America/New_York"
  daily_close:
    time: "17:00"
    timezone: "America/New_York"

sessions:
  calendar_name: "default"
  weekend_policy: "include"
  holiday_policy: "include"
  definitions:
    - name: "primary"
      start: "17:00"
      end: "16:59"
      start_day: 6  # Sunday
      end_day: 4    # Friday

resampling:
  base_timeframe: "1m"
  target_timeframes:
    - "5m"
    - "15m"
    - "1h"
    - "4h"
#   - "1d"

features:
  enabled_features:
    - "returns"
    - "ranges"
    - "wick_body_ratios"
  deterministic_derived_features:
    - "returns"
    - "ranges"
    - "wick_body_ratios"

labeling:
  thresholds:
    - 10.0
  horizon_bars:
    - 15
    - 60
    - 120

walk_forward:
  train_bars: 10000
  validation_bars: 2000
  test_bars: 2000
  step_bars: 2000

training:
  random_seed: 42
  batch_size: 32
  learning_rate: 0.001
  max_epochs: 6
  device_preference: "cpu"
  allow_nondeterministic: false
  input_root: "/kaggle/tmp/sebulenipromaxai/artifacts/preprocessing_shards"
  output_root: "/kaggle/tmp/sebulenipromaxai/artifacts/training_artifacts"

preprocessing:
  lookbacks_by_timeframe:
    "1m": 90
    "5m": 60
    "15m": 48
    "1h": 24
    "4h": 16
#    "1d": 10
  output_root: "/kaggle/tmp/sebulenipromaxai/artifacts/preprocessing_shards"

unified_heads:
  enabled: true
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
#    - "1d"
  horizons:
    - 15
    - 60
    - 120
  default_outputs:
    - timeframe: "1m"
      horizons:
        - 15
        - 60
        - 120
    - timeframe: "5m"
      horizons:
        - 15
        - 60
        - 120
    - timeframe: "15m"
      horizons:
        - 15
        - 60
        - 120
    - timeframe: "1h"
      horizons:
        - 15
        - 60
        - 120
    - timeframe: "4h"
      horizons:
        - 15
        - 60
        - 120
#    - timeframe: "1d"
#      horizons:
#        - 15
#        - 60
#        - 120

retrieval:
  top_k_analogs: 5

api:
  host: "127.0.0.1"
  port: 8000

reporting:
  output_dir: "kaggle/tmp/sebulenipromaxai/artifacts/reports"

schedules:
  reporting_cron: "0 9 * * *"
  retraining_review_cron: "0 0 * * 1"
